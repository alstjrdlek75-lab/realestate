<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" style="background:#f8fafc; font-family: Pretendard, sans-serif;">
    <rect width="1000" height="800" fill="#fcfdfd"/>
    <rect x="20" y="20" width="960" height="760" fill="none" stroke="#0f172a" stroke-width="3"/>
    
    <!-- Han River South -->
    <path d="M 30 560 Q 500 590 970 540 L 970 770 L 30 770 Z" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
    <text x="500" y="680" fill="#0369a1" font-size="28" font-weight="900" letter-spacing="8" text-anchor="middle">한 강 (압구정·청담동 맞은편)</text>

    <!-- Seoul Forest Park (West) -->
    <path d="M 40 120 L 220 120 L 220 540 L 40 540 Z" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
    <text x="130" y="320" fill="#14532d" font-size="20" font-weight="900" text-anchor="middle" transform="rotate(-90 130 320)">🌳 서울숲 (Seoul Forest 35만평)</text>

    <!-- Gangbyeon Expressway Underground Park -->
    <path d="M 230 530 L 960 510 L 960 550 L 230 570 Z" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.5"/>
    <text x="600" y="555" fill="#15803d" font-size="12" font-weight="bold" text-anchor="middle">강변북로 지하화 상부 한강수변 문화공원 벨트</text>

    <!-- Seongsu 1 District -->
    <path d="M 230 160 L 400 160 L 400 520 L 230 520 Z" fill="#fde047" stroke="#ca8a04" stroke-width="2.5"/>
    <text x="315" y="300" fill="#713f12" font-size="22" font-weight="900" text-anchor="middle">성수 1지구</text>
    <text x="315" y="330" fill="#854d0e" font-size="15" font-weight="bold" text-anchor="middle">3,014세대 (최고 70층)</text>
    <text x="315" y="355" fill="#a16207" font-size="12" font-weight="bold" text-anchor="middle">서울숲역 3분 | 트리마제 인접</text>
    <text x="315" y="380" fill="#b45309" font-size="12" font-weight="bold" text-anchor="middle">서울숲+한강 남향 대장</text>

    <!-- Seongsu 2 District -->
    <path d="M 410 160 L 580 160 L 580 515 L 410 520 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <text x="495" y="300" fill="#713f12" font-size="20" font-weight="900" text-anchor="middle">성수 2지구</text>
    <text x="495" y="330" fill="#854d0e" font-size="14" font-weight="bold" text-anchor="middle">1,907세대</text>
    <text x="495" y="355" fill="#a16207" font-size="12" font-weight="bold" text-anchor="middle">2호선 뚝섬역세권</text>
    <text x="495" y="380" fill="#b45309" font-size="12" font-weight="bold" text-anchor="middle">수변 문화공원 직결</text>

    <!-- Seongsu 3 District -->
    <path d="M 590 160 L 760 160 L 760 510 L 590 515 Z" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>
    <text x="675" y="300" fill="#713f12" font-size="20" font-weight="900" text-anchor="middle">성수 3지구</text>
    <text x="675" y="330" fill="#854d0e" font-size="14" font-weight="bold" text-anchor="middle">1,852세대</text>
    <text x="675" y="355" fill="#a16207" font-size="12" font-weight="bold" text-anchor="middle">2호선 성수역세권</text>
    <text x="675" y="380" fill="#b45309" font-size="12" font-weight="bold" text-anchor="middle">성수 IT 밸리 직주일치</text>

    <!-- Seongsu 4 District -->
    <path d="M 770 160 L 950 160 L 950 500 L 770 510 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2.5"/>
    <text x="860" y="300" fill="#713f12" font-size="20" font-weight="900" text-anchor="middle">성수 4지구</text>
    <text x="860" y="330" fill="#854d0e" font-size="14" font-weight="bold" text-anchor="middle">1,584세대</text>
    <text x="860" y="355" fill="#a16207" font-size="12" font-weight="bold" text-anchor="middle">영동대교 직통 (청담 3분)</text>
    <text x="860" y="380" fill="#b45309" font-size="12" font-weight="bold" text-anchor="middle">파노라마 한강 조망</text>

    <!-- Bridges -->
    <path d="M 120 540 L 120 770" stroke="#3b82f6" stroke-width="8"/>
    <text x="135" y="660" fill="#1e40af" font-size="12" font-weight="bold">성수대교 (압구정 직결)</text>

    <path d="M 900 500 L 900 770" stroke="#3b82f6" stroke-width="8"/>
    <text x="915" y="660" fill="#1e40af" font-size="12" font-weight="bold">영동대교 (청담 직결)</text>

    <!-- Title Block -->
    <g transform="translate(680, 35)">
      <rect width="280" height="100" fill="#ffffff" stroke="#0f172a" stroke-width="2" rx="8"/>
      <text x="140" y="28" fill="#0f172a" font-size="16" font-weight="900" text-anchor="middle">성수전략정비구역</text>
      <text x="140" y="52" fill="#059669" font-size="14" font-weight="bold" text-anchor="middle">1·2·3·4지구 재개발 정비계획도</text>
      <text x="140" y="75" fill="#64748b" font-size="11" text-anchor="middle">최고 50~70층 초고층 한강변 9,000세대</text>
    </g>
  </svg>