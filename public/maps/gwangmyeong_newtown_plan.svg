<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" style="background:#f8fafc; font-family: Pretendard, sans-serif;">
    <rect width="1000" height="800" fill="#fcfdfd"/>
    <rect x="20" y="20" width="960" height="760" fill="none" stroke="#0f172a" stroke-width="3"/>

    <!-- Mokgamcheon River West -->
    <path d="M 60 30 Q 80 400 60 770" stroke="#0284c7" stroke-width="14" fill="none"/>
    <text x="45" y="400" fill="#0369a1" font-size="16" font-weight="black" text-anchor="middle" transform="rotate(-90 45 400)">목감천 수변공원 (Mokgam Stream)</text>

    <!-- 7 Line Subway Axis -->
    <path d="M 30 450 L 970 450" stroke="#16a34a" stroke-width="10"/>
    <text x="350" y="440" fill="#14532d" font-size="15" font-weight="black">🚇 7호선 광명사거리역 (가산 5분, 강남 30분)</text>
    <text x="750" y="440" fill="#14532d" font-size="15" font-weight="black">🚇 7호선 철산역</text>

    <!-- Gwangmyeong 1 District (Top North) -->
    <path d="M 120 120 L 450 120 L 420 300 L 120 300 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <text x="280" y="190" fill="#713f12" font-size="20" font-weight="900" text-anchor="middle">광명 1구역 (트리우스 광명)</text>
    <text x="280" y="218" fill="#854d0e" font-size="14" font-weight="bold" text-anchor="middle">대우·현대·롯데 3,585세대</text>
    <text x="280" y="240" fill="#ca8a04" font-size="12" font-weight="bold" text-anchor="middle">준공 및 입주</text>

    <!-- Gwangmyeong 4 District -->
    <path d="M 120 315 L 350 315 L 350 435 L 120 435 Z" fill="#fde047" stroke="#eab308" stroke-width="2"/>
    <text x="235" y="365" fill="#713f12" font-size="18" font-weight="900" text-anchor="middle">광명 4구역</text>
    <text x="235" y="390" fill="#854d0e" font-size="13" font-weight="bold" text-anchor="middle">센트럴 아이파크 1,957세대</text>
    <text x="235" y="410" fill="#a16207" font-size="11" font-weight="bold" text-anchor="middle">광명사거리역 도보 5분</text>

    <!-- Gwangmyeong 11 District (Center Mammoth Leader) -->
    <path d="M 370 315 L 700 315 L 680 580 L 370 580 Z" fill="#facc15" stroke="#ca8a04" stroke-width="3.5"/>
    <text x="530" y="420" fill="#713f12" font-size="24" font-weight="900" text-anchor="middle">광명 11구역 (원탑 대장주)</text>
    <text x="530" y="455" fill="#854d0e" font-size="16" font-weight="bold" text-anchor="middle">현대 힐스테이트·아이파크 4,291세대</text>
    <text x="530" y="485" fill="#a16207" font-size="13" font-weight="bold" text-anchor="middle">7호선 광명사거리역 초역세권 직통</text>

    <!-- Gwangmyeong 12 District (East Cheolsan) -->
    <path d="M 720 315 L 940 315 L 920 580 L 720 580 Z" fill="#fde047" stroke="#eab308" stroke-width="2.5"/>
    <text x="830" y="420" fill="#713f12" font-size="20" font-weight="900" text-anchor="middle">광명 12구역</text>
    <text x="830" y="450" fill="#854d0e" font-size="14" font-weight="bold" text-anchor="middle">GS건설 (철산역 자이) 2,097세대</text>
    <text x="830" y="475" fill="#a16207" font-size="12" font-weight="bold" text-anchor="middle">철산역 더블생활권 대장</text>

    <!-- Other Districts 2, 5, 9, 10, 14, 15, 16 -->
    <path d="M 120 600 L 920 600 L 920 740 L 120 740 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="520" y="660" fill="#713f12" font-size="18" font-weight="900" text-anchor="middle">광명 2·5·9·10·14·15·16구역 정비구역 일원</text>
    <text x="520" y="688" fill="#854d0e" font-size="13" font-weight="bold" text-anchor="middle">광명 자이힐스테이트SK, 베르몬트로, 푸르지오포레나 등 총 25,000세대 미니신도시급 타운</text>

    <!-- Title Block -->
    <g transform="translate(680, 35)">
      <rect width="280" height="95" fill="#ffffff" stroke="#0f172a" stroke-width="2" rx="8"/>
      <text x="140" y="26" fill="#0f172a" font-size="16" font-weight="900" text-anchor="middle">광명 재정비촉진지구</text>
      <text x="140" y="48" fill="#7c3aed" font-size="14" font-weight="bold" text-anchor="middle">1~16구역 전수 정비구역도</text>
      <text x="140" y="70" fill="#64748b" font-size="11" text-anchor="middle">서울 02 국번 총 25,000세대 메가 뉴타운</text>
    </g>
  </svg>