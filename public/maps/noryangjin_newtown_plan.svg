<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" style="background:#f8fafc; font-family: Pretendard, sans-serif;">
    <rect width="1000" height="800" fill="#fcfdfd"/>
    <rect x="20" y="20" width="960" height="760" fill="none" stroke="#0f172a" stroke-width="3"/>

    <!-- North: 1·9 Subway Line & Noryangjin Station -->
    <path d="M 30 120 L 970 120" stroke="#3b82f6" stroke-width="12"/>
    <text x="500" y="110" fill="#1e3a8a" font-size="16" font-weight="black" text-anchor="middle">🚇 지하철 1호선 & 9호선 노량진역 급행 (여의도 3분 / 강남 14분)</text>

    <!-- Noryangjin 1 District (Top Center Mammoth) -->
    <path d="M 280 150 L 720 150 L 680 420 L 320 420 Z" fill="#facc15" stroke="#ca8a04" stroke-width="3"/>
    <text x="500" y="260" fill="#713f12" font-size="26" font-weight="900" text-anchor="middle">노량진 1구역 (원탑 대장주)</text>
    <text x="500" y="295" fill="#854d0e" font-size="16" font-weight="bold" text-anchor="middle">오티에르 노량진 (포스코이앤씨) 2,992세대</text>
    <text x="500" y="325" fill="#a16207" font-size="13" font-weight="bold" text-anchor="middle">1·9호선 노량진역 / 7호선 장승배기역 트리플 역세권</text>

    <!-- Noryangjin 3 District (North West) -->
    <path d="M 50 150 L 270 150 L 270 380 L 70 360 Z" fill="#fde047" stroke="#eab308" stroke-width="2"/>
    <text x="160" y="240" fill="#713f12" font-size="18" font-weight="900" text-anchor="middle">노량진 3구역</text>
    <text x="160" y="265" fill="#854d0e" font-size="13" font-weight="bold" text-anchor="middle">포스코 1,012세대</text>
    <text x="160" y="285" fill="#a16207" font-size="11" font-weight="bold" text-anchor="middle">노량진역 4분 | 한강뷰</text>

    <!-- Noryangjin 2 District (South East) -->
    <path d="M 740 440 L 940 440 L 920 620 L 740 600 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <text x="830" y="510" fill="#713f12" font-size="16" font-weight="900" text-anchor="middle">노량진 2구역</text>
    <text x="830" y="535" fill="#854d0e" font-size="12" font-weight="bold" text-anchor="middle">드파인 (SK) 415세대</text>
    <text x="830" y="555" fill="#ca8a04" font-size="11" font-weight="bold" text-anchor="middle">장승배기역 초역세권</text>

    <!-- Noryangjin 6 District (South Center) -->
    <path d="M 330 440 L 670 440 L 640 680 L 350 680 Z" fill="#fde047" stroke="#eab308" stroke-width="2.5"/>
    <text x="500" y="540" fill="#713f12" font-size="20" font-weight="900" text-anchor="middle">노량진 6구역</text>
    <text x="500" y="570" fill="#854d0e" font-size="14" font-weight="bold" text-anchor="middle">자이·SK VIEW 1,499세대</text>
    <text x="500" y="595" fill="#a16207" font-size="12" font-weight="bold" text-anchor="middle">철거 착공 | 7호선 장승배기역</text>

    <!-- Noryangjin 4, 5, 7, 8 Districts -->
    <path d="M 50 400 L 270 400 L 250 650 L 50 620 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="150" y="510" fill="#713f12" font-size="16" font-weight="900" text-anchor="middle">노량진 4·5·7·8구역</text>
    <text x="150" y="535" fill="#854d0e" font-size="12" font-weight="bold" text-anchor="middle">힐스테이트, 써밋, 아크로</text>
    <text x="150" y="555" fill="#ca8a04" font-size="11" font-weight="bold" text-anchor="middle">총 3,500여 세대</text>

    <!-- South: 7 Line Jangseungbaegi -->
    <path d="M 30 700 L 970 700" stroke="#16a34a" stroke-width="10"/>
    <text x="500" y="730" fill="#14532d" font-size="15" font-weight="black" text-anchor="middle">🚇 지하철 7호선 장승배기역 (강남 직결)</text>

    <!-- Title Block -->
    <g transform="translate(680, 35)">
      <rect width="280" height="95" fill="#ffffff" stroke="#0f172a" stroke-width="2" rx="8"/>
      <text x="140" y="26" fill="#0f172a" font-size="16" font-weight="900" text-anchor="middle">노량진 재정비촉진지구</text>
      <text x="140" y="48" fill="#2563eb" font-size="14" font-weight="bold" text-anchor="middle">1~8구역 통합 토지이용계획도</text>
      <text x="140" y="70" fill="#64748b" font-size="11" text-anchor="middle">여의도·용산 배후 총 9,098세대 메가타운</text>
    </g>
  </svg>